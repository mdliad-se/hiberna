name: CI

# Runs on every branch and pull request. The release workflow only fires on a
# v* tag, which made the first tag push the first execution of the build - two
# defects (a non-executable gradlew, a test task that cannot pass) surfaced
# during a release instead of before one.
on:
  push:
    branches-ignore:
      - 'gh-pages'
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@48b5f213c81028ace310571dc5ec0fbbca0b2947 # v4

      # Not `test`: that also runs testReleaseUnitTest, which cannot pass by
      # design - see the comment in release.yml.
      - name: Unit tests
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Upload the test report on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: test-report
          path: app/build/reports/tests/testDebugUnitTest
          retention-days: 7

      # No signing secrets are exposed to this job, which is the point: it
      # proves a release build still succeeds from a plain checkout and
      # produces an unsigned APK. F-Droid and every outside contributor build
      # in exactly this position, so if this breaks, the app stops being
      # buildable by anyone but the maintainer.
      - name: Release build without signing material
        run: ./gradlew --no-daemon assembleRelease

      - name: Assert the unsigned APK is what came out
        run: |
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            echo "::error::a signed APK appeared in a job with no signing secrets"
            exit 1
          fi
          ls -l app/build/outputs/apk/release/app-release-unsigned.apk
