name: Release

# Pushing a v* tag builds, signs and opens a DRAFT GitHub release. A human
# reviews the artefact and publishes it. hiberna asks users for shell-level
# privilege, so an unreviewed build must never become public automatically.
on:
  push:
    tags:
      - 'v*'
  # Lets a failed release be re-run against an existing tag without moving it.
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to build (for example v1.0.0)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the tagged source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          # Pinned to match the toolchain F-Droid must reproduce. Do not float.
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # A release whose tag and versionName disagree cannot be rebuilt from its
      # own tag, which is exactly what F-Droid and every user verifying a
      # checksum rely on. Fail before anything is compiled.
      - name: Assert the tag matches versionName
        run: |
          tag="${{ inputs.tag || github.ref_name }}"
          version_name="$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts)"
          echo "tag=$tag versionName=$version_name"
          if [ -z "$version_name" ]; then
            echo "::error::could not read versionName from app/build.gradle.kts"
            exit 1
          fi
          if [ "$tag" != "v$version_name" ]; then
            echo "::error::tag $tag does not match versionName $version_name (expected v$version_name). Bump versionName or retag."
            exit 1
          fi

      - name: Run the test suite
        run: ./gradlew --no-daemon test

      - name: Decode the signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::KEYSTORE_BASE64 is not set. See docs/RELEASING.md for the four required secrets."
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"

      # assembleRelease already fans in verifyShizukuSeeds, which fails the
      # build if R8 dropped the privileged Shizuku entry point.
      - name: Build the signed release APK
        env:
          HIBERNA_KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          HIBERNA_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          HIBERNA_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          HIBERNA_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew --no-daemon assembleRelease

      - name: Verify the APK is signed with the expected certificate
        run: |
          build_tools="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"
          "$build_tools/apksigner" verify --print-certs --verbose \
            app/build/outputs/apk/release/app-release.apk

      - name: Stage the release assets
        run: |
          tag="${{ inputs.tag || github.ref_name }}"
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/hiberna-${tag}.apk"
          # R8 obfuscates the release build, so a user-submitted stack trace is
          # unreadable without the mapping file. It exposes nothing the GPL-3
          # source does not already.
          cp app/build/outputs/mapping/release/mapping.txt "dist/mapping-${tag}.txt"
          cd dist && sha256sum ./* > SHA256SUMS && cat SHA256SUMS

      - name: Remove the keystore from the runner
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"

      - name: Open a draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ inputs.tag || github.ref_name }}"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" dist/* --clobber
          else
            gh release create "$tag" dist/* \
              --draft \
              --title "hiberna $tag" \
              --generate-notes
          fi
